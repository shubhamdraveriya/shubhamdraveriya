<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-label="Hyperspectral Payload Processor: The onboard data chain of an Earth-observation satellite on a Zynq UltraScale+: sensor, CCSDS 123 compression, Reed-Solomon and AOS framing, a 1.25 Gbaud fiber link and a ground station that recovers it bit-exact.">
  <title>Hyperspectral Payload Processor: The onboard data chain of an Earth-observation satellite on a Zynq UltraScale+: sensor, CCSDS 123 compression, Reed-Solomon and AOS framing, a 1.25 Gbaud fiber link and a ground station that recovers it bit-exact.</title>
  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect x="0.5" y="0.5" width="599" height="339" rx="18" fill="#fbfaf6" stroke="#dcd9e6"/>
  <rect x="32" y="30" width="44" height="5" rx="2.5" fill="#a36f00"/>
  <text x="32" y="64" class="mono" font-size="13" letter-spacing="2" fill="#a36f00">01 · SPACE PAYLOAD · ZCU106</text>
  <text x="568" y="64" text-anchor="end" class="mono" font-size="20" fill="#85839c">↗</text>
  <text x="30" y="104" class="sans" font-size="31" font-weight="800" letter-spacing="-0.5" fill="#1b1c36">Hyperspectral Payload Processor</text>
  <text x="32" y="140" class="sans" font-size="17.5" fill="#4a4963">The onboard data chain of an Earth-observation satellite</text>
  <text x="32" y="165" class="sans" font-size="17.5" fill="#4a4963">on a Zynq UltraScale+: sensor, CCSDS 123 compression,</text>
  <text x="32" y="190" class="sans" font-size="17.5" fill="#4a4963">Reed-Solomon and AOS framing, a 1.25 Gbaud fiber link and</text>
  <text x="32" y="215" class="sans" font-size="17.5" fill="#4a4963">a ground station that recovers it bit-exact.</text>
  <path d="M32 232 H568" stroke="#dcd9e6"/>
  <text x="32" y="266" class="mono" font-size="25" font-weight="700" fill="#1b1c36">250 MHz</text>
  <text x="32" y="288" class="mono" font-size="12.5" fill="#85839c">timing met, full chip</text>
  <text x="216" y="266" class="mono" font-size="25" font-weight="700" fill="#1b1c36">3.4×10¹²</text>
  <text x="216" y="288" class="mono" font-size="12.5" fill="#85839c">bits error-free</text>
  <text x="400" y="266" class="mono" font-size="25" font-weight="700" fill="#1b1c36">944</text>
  <text x="400" y="288" class="mono" font-size="12.5" fill="#85839c">images bit-exact</text>
