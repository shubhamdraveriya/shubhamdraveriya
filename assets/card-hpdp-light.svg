  <text x="93.69999999999999" y="320.5" text-anchor="middle" class="mono" font-size="13" fill="#a36f00">SystemVerilog</text>
  <rect x="163.39999999999998" y="304" width="68.8" height="24" rx="12" fill="#a36f00" fill-opacity="0.12" stroke="#a36f00" stroke-opacity="0.5"/>
  <text x="197.79999999999998" y="320.5" text-anchor="middle" class="mono" font-size="13" fill="#a36f00">Vivado</text>
  <rect x="240.2" y="304" width="61.0" height="24" rx="12" fill="#a36f00" fill-opacity="0.12" stroke="#a36f00" stroke-opacity="0.5"/>
  <text x="270.7" y="320.5" text-anchor="middle" class="mono" font-size="13" fill="#a36f00">CCSDS</text>
  <rect x="309.2" y="304" width="92.2" height="24" rx="12" fill="#a36f00" fill-opacity="0.12" stroke="#a36f00" stroke-opacity="0.5"/>
  <text x="355.3" y="320.5" text-anchor="middle" class="mono" font-size="13" fill="#a36f00">SEM + TMR</text>
